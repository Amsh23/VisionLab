name: Temporary app validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile app.py
        run: python -m py_compile app.py
      - name: Install and import core dependencies
        run: |
          python -m pip install --disable-pip-version-check streamlit opencv-python-headless numpy pillow scikit-learn
          python -c "import streamlit, cv2, numpy, PIL, sklearn; print('Core imports passed')"
