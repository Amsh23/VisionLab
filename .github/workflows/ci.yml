
name: VisionLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate GitHub Actions workflow syntax
        shell: bash
        run: |
          version="$(curl -fsSL https://api.github.com/repos/rhysd/actionlint/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          archive="/tmp/actionlint.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${version}/actionlint_${version#v}_linux_amd64.tar.gz" -o "$archive"
          tar -xzf "$archive" -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

      - name: Check Python syntax
        run: python -m compileall -q app.py resistor_analyzer.py live_webcam.py hosted_inference.py scripts tests

      - name: Check libraries
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          import cv2
          import matplotlib
          import numpy
          import pandas
          import PIL
          import requests
          import sklearn
          import streamlit

          installed_opencv = []
          for distribution in ("opencv-python", "opencv-python-headless"):
              try:
                  metadata.version(distribution)
              except metadata.PackageNotFoundError:
                  continue
              installed_opencv.append(distribution)
          if len(installed_opencv) != 1:
              raise SystemExit(
                  "Runtime must install exactly one OpenCV wheel; found: "
                  + ", ".join(installed_opencv)
              )
          metadata.version("ultralytics")
          print(f"Runtime imports succeeded with {installed_opencv[0]} and Ultralytics.")
          PY

      - name: Smoke-test every Streamlit page
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          pages = [
              "Home",
              "Electronic Component Analyzer",
              "Image Fundamentals",
              "Image Processing & Filters",
              "Edge & Shape Detection",
              "Color Detection",
              "Feature Detection",
              "Image Matching",
              "Image Segmentation",
              "Object Detection (YOLO)",
              "Video Processing",
              "Machine Learning Demo",
          ]

          app = AppTest.from_file("app.py", default_timeout=30).run()
          for page in pages:
              app.session_state["navigation_page"] = page
              app.run()
              if len(app.exception) > 0:
                  raise SystemExit(f"Streamlit page {page!r} raised an exception: {app.exception!r}")
          print(f"All {len(pages)} Streamlit pages started successfully.")
          PY

      - name: Validate dev-container JSON
        run: python -m json.tool .devcontainer/devcontainer.json > /dev/null

      - name: Run resistor decoder tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test synthetic dataset generator
        run: |
          python scripts/generate_resistor_dataset.py --count 12 --output /tmp/resistor-dataset-smoke
          test -f /tmp/resistor-dataset-smoke/labels.csv
          test "$(find /tmp/resistor-dataset-smoke/images -type f | wc -l)" -eq 12
