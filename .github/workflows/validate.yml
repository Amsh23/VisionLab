name: Validate VisionLab
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py resistor_analyzer.py scripts/generate_resistor_dataset.py
      - name: Run resistor decoder tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test synthetic dataset generator
        run: |
          python scripts/generate_resistor_dataset.py --count 12 --output /tmp/resistor-dataset-smoke
          test -f /tmp/resistor-dataset-smoke/labels.csv
          test "$(find /tmp/resistor-dataset-smoke/images -type f | wc -l)" -eq 12
