name: Train VisionLab Models

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-electronics-models.yml"
      - "requirements.txt"
      - "requirements-training.txt"
      - "resistor_analyzer.py"
      - "resistor_band_classifier.py"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visionlab-model-training
  cancel-in-progress: true

jobs:
  train-and-publish:
    name: Download datasets, train and publish models
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-training.txt

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-training.txt huggingface_hub pyyaml

      - name: Download datasets and train models
        run: python scripts/train_models_ci.py all

      - name: Commit trained model checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            models/components.pt \
            models/iot_components.pt \
            models/iot_boards.pt \
            models/resistor_seg.pt \
            models/resistor_band_classifier.joblib \
            models/resistor_band_classifier.metrics.json \
            models/training-report.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new model files were available to publish."
            exit 0
          fi
          # Training can take a long time; another source commit may land meanwhile.
          # Rebase the publish commit on the latest main while preserving generated files.
          git fetch origin main
          git reset --mixed origin/main
          for file in \
            models/components.pt \
            models/iot_components.pt \
            models/iot_boards.pt \
            models/resistor_seg.pt \
            models/resistor_band_classifier.joblib \
            models/resistor_band_classifier.metrics.json \
            models/training-report.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new model files were available to publish."
            exit 0
          fi
          git commit -m "Add trained VisionLab model checkpoints"
          git push origin HEAD:main
