name: Train VisionLab Models

on:
  # Model training is manual because it is CPU-intensive. Ordinary code pushes
  # run the lightweight CI workflow, not a full dataset download and retrain.
  workflow_dispatch:
    inputs:
      task:
        description: "Which model should be trained?"
        required: true
        type: choice
        default: electronics
        options:
          - electronics
          - iot
          - resistor-colors
          - all

permissions:
  contents: write

concurrency:
  group: visionlab-model-training-v3
  cancel-in-progress: true

jobs:
  train-and-publish:
    name: Download datasets, train and publish models
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-training.txt

      - name: Restore downloaded datasets cache
        uses: actions/cache@v6
        with:
          path: |
            data/circuit-elements
            data/circuit-elements-normalized
            data/component_dataset
            data/iot_roboflow
            data/iotkits_raw
            data/iotkits_yolo
            data/resistor_color_bands
          key: visionlab-datasets-${{ runner.os }}-${{ hashFiles('scripts/download*.py', 'scripts/prepare*.py') }}
          restore-keys: |
            visionlab-datasets-${{ runner.os }}-

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-training.txt huggingface_hub pyyaml

      - name: Download datasets and train selected model
        run: python scripts/train_models_ci.py "${{ inputs.task }}"

      - name: Commit trained model checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            models/components.pt \
            models/iot_components.pt \
            models/iot_boards.pt \
            models/resistor_seg.pt \
            models/resistor_value_seg.pt \
            models/resistor_band_classifier.joblib \
            models/resistor_band_classifier.metrics.json \
            models/training-report.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new model files were available to publish."
            exit 0
          fi
          # Training can take a long time; another source commit may land meanwhile.
          # Rebase the publish commit on the latest main while preserving generated files.
          git fetch origin main
          git reset --mixed origin/main
          for file in \
            models/components.pt \
            models/iot_components.pt \
            models/iot_boards.pt \
            models/resistor_seg.pt \
            models/resistor_band_classifier.joblib \
            models/resistor_band_classifier.metrics.json \
            models/training-report.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new model files were available to publish."
            exit 0
          fi
          git commit -m "Add trained VisionLab model checkpoints"
          git push origin HEAD:main
